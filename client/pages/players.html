<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogadores NBA - Basket Store</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <h1>Jogadores NBA</h1>
      <p>Pesquisa jogadores reais usando dados da API pública.</p>
    </div>
    <nav>
      <a href="../index.html">Loja</a>
      <a href="./players.html" class="active">Jogadores</a>
      <a href="./teams.html">Equipas</a>
      <a href="./cart.html">Carrinho</a>
      <a href="./about.html">Sobre</a>
    </nav>
  </header>

  <main>
    <section class="filters">
      <div>
        <label for="playerSearch">Pesquisar jogador</label>
        <input id="playerSearch" type="text" placeholder="LeBron, Curry, James..." />
      </div>
      <div>
        <label for="teamFilter">Filtrar por equipa</label>
        <select id="teamFilter">
          <option value="all">Todas as equipas</option>
        </select>
      </div>
      <div>
        <label for="positionFilter">Filtrar por posição</label>
        <select id="positionFilter">
          <option value="all">Todas as posições</option>
          <option value="G">Guarda</option>
          <option value="F">Ala</option>
          <option value="C">Centro</option>
        </select>
      </div>
      <button id="loadMorePlayers" type="button">Carregar mais</button>
    </section>

    <section>
      <h2>Resultados</h2>
      <div id="playersContainer" class="cards-grid"></div>
    </section>
  </main>

  <script type="module" src="../js/players.js"></script>
</body>
</html>
